version: '3.8'

services:
  # ──────────────────────────── API Gateway ────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: nexusinfer-api
    container_name: nexusinfer-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=NexusInfer
      - DATABASE_URL=postgresql://nexus:nexus@postgres:5432/nexusinfer
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nexus-network
    restart: unless-stopped

  # ──────────────────────────── Celery Worker ────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: nexusinfer-worker
    container_name: nexusinfer-worker
    environment:
      - DATABASE_URL=postgresql://nexus:nexus@postgres:5432/nexusinfer
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nexus-network
    deploy:
      replicas: 1
    restart: unless-stopped

  # ──────────────────────────── Message Broker ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexusinfer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus-network
    restart: unless-stopped

  # ──────────────────────────── Database ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexusinfer-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexusinfer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusinfer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus-network
    restart: unless-stopped

# ──────────────────────────── Networks & Volumes ────────────────────────────
networks:
  nexus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
